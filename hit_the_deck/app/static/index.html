<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="author" content="Simon Eckmiller">
<title data-t="pageTitle">Hit the Deck</title>
<!-- Hit the Deck configurator. Copyright (c) 2026 Simon Eckmiller. MIT License. -->
<style>
  :root{
    --bg:#1b1d21; --panel:#26282d; --panel2:#2f3238; --line:#3a3d44;
    --accent:#03a9f4; --accent2:#2f9e44; --text:#e9eaec; --muted:#9aa0a8;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--text);font-size:14px}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--panel);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  header .spacer{flex:1}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;color:var(--muted)}
  .pill b{color:var(--text)}
  button.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
  button.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  button.btn.small{padding:4px 9px;font-size:12px}
  button.btn:active{transform:translateY(1px)}
  main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;padding:20px;align-items:start}
  @media(max-width:900px){main{grid-template-columns:1fr;padding:16px}}
  .devicewrap{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .devicenote{color:var(--muted);font-size:12px;text-align:center;margin:0 0 10px}
  .pagetabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .pagetabs .tab{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
                 padding:6px 14px;cursor:pointer;color:var(--muted);display:flex;gap:8px;align-items:center}
  .pagetabs .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pagetabs .tab .x{opacity:.7;font-size:11px}
  .grid{display:grid;gap:12px;max-width:560px;margin:0 auto}
  .key{aspect-ratio:1/1;background:#000;border:2px solid #000;border-radius:10px;overflow:hidden;
       cursor:pointer;position:relative;transition:border-color .12s;padding:0}
  .key img{width:100%;height:100%;display:block}
  .key:hover{border-color:#555}
  .key.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(3,169,244,.25)}
  .key .idx{position:absolute;left:4px;bottom:3px;font-size:10px;color:#666}
  .screenbar{margin:22px auto 0;width:248px;max-width:100%}
  .screenbar img{width:248px;max-width:100%;height:auto;aspect-ratio:248/58;border-radius:6px;border:1px solid var(--line);
                 background:#000;display:block;cursor:pointer}
  .screenbar .cap{color:var(--muted);font-size:11px;margin-bottom:6px;text-align:center}
  .profilebar{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:14px}
  .profilebar select,.profilebar input{max-width:160px}
  .tip{color:var(--muted);font-size:12px;margin-top:14px}
  aside{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:sticky;top:66px;
        max-height:calc(100vh - 90px);overflow-y:auto}
  @media(max-width:900px){aside{position:static;max-height:none}}
  aside h2{font-size:14px;margin:0 0 14px}
  label.field{display:block;margin:0 0 12px}
  label.field span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
  input[type=text],select,input[type=search],input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--line);
       color:var(--text);border-radius:6px;padding:8px 10px;font-size:13px}
  input[type=color]{width:44px;height:32px;background:none;border:1px solid var(--line);border-radius:6px;padding:0}
  .row{display:flex;gap:10px;align-items:center}
  .row>*{flex:1}
  .chk{display:flex;align-items:center;gap:8px;margin:0 0 12px}
  .chk input{width:auto}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .seg button{flex:1;background:var(--panel2);border:0;color:var(--muted);padding:7px 4px;cursor:pointer;font-size:12px}
  .seg button.on{background:var(--accent);color:#fff}
  .hint{color:var(--muted);font-size:11px;margin-top:-6px;margin-bottom:12px}
  .note{color:var(--accent2);font-size:12px;min-height:16px;margin-top:6px}
  .box{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px}
  hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  details summary{cursor:pointer;color:var(--muted);margin-bottom:10px}
  .cwrap{display:flex;align-items:center;gap:6px}
  .cwrap input[type=color]{flex:0 0 52px;width:52px;height:34px}
  .cwrap button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px 8px;cursor:pointer;font-size:11px}
  .cwrap button.autoactive{color:var(--accent);border-color:var(--accent)}
  .iconprev{width:40px;height:40px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;flex:0 0 40px;object-fit:contain;padding:2px}
  #iconmodal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
  #iconmodal.open{display:flex}
  .icondlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(720px,100%);max-height:min(80vh,700px);
           display:flex;flex-direction:column;box-shadow:0 18px 60px rgba(0,0,0,.55)}
  .icondlg .dlghead{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
  .icondlg .dlghead h3{margin:0;font-size:14px;flex:1}
  .icondlg .close{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer}
  .iconsearchrow{padding:12px 16px 4px}
  .iconchips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 10px}
  .iconchips button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:16px;padding:4px 11px;cursor:pointer;font-size:12px}
  .iconchips button:hover,.iconchips button.on{color:#fff;background:var(--accent);border-color:var(--accent)}
  .icongrid{overflow-y:auto;padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
  .icell{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 4px 6px;cursor:pointer;text-align:center}
  .icell:hover{border-color:var(--accent)}
  .icell img{width:40px;height:40px;display:block;margin:0 auto 4px}
  .icell div{font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconempty{color:var(--muted);font-size:12px;padding:18px 16px}
</style>
</head>
<body>
<header>
  <h1>Hit the Deck</h1>
  <span class="pill" id="ttpill"></span>
  <div class="spacer"></div>
  <div class="pill"><span data-t="brightness"></span> <input type="range" id="bright" min="10" max="100" style="vertical-align:middle;width:100px"> <b id="brightval">80</b>%</div>
  <button class="btn" id="saveall" data-t="saveAll"></button>
</header>

<main>
  <section class="devicewrap">
    <p class="devicenote" id="devicenote" data-t="deckNotConnected" hidden></p>
    <div class="pagetabs" id="pagetabs"></div>
    <div class="grid" id="grid"></div>
    <div class="screenbar" id="screenbar">
      <div class="cap" data-t="screenCaption"></div>
      <img id="screenimg" src="api/screen-preview" alt="" data-t-alt="screenCaption">
    </div>
    <div class="profilebar">
      <b style="font-size:12px;color:var(--muted)" data-t="profiles"></b>
      <select id="profsel"></select>
      <button class="btn ghost small" id="profload" data-t="load"></button>
      <input type="text" id="profname" data-t-placeholder="namePlaceholder">
      <button class="btn ghost small" id="profsave" data-t="save"></button>
      <button class="btn ghost small" id="profexport" data-t="export"></button>
      <button class="btn ghost small" id="profimport" data-t="import"></button>
      <input type="file" id="proffile" accept=".json" hidden>
    </div>
    <p class="tip"><span data-t="deckTip"></span> <a href="https://github.com/simon-says-labs/track-time" target="_blank" rel="noopener">Track Time</a></p>
  </section>

  <aside id="editor">
    <h2 id="edtitle" data-t="pickKey"></h2>
    <div id="edbody" hidden>
      <label class="field"><span data-t="kind"></span>
        <select id="f_kind">
          <option value="entity" data-t="kindEntity"></option>
          <option value="track_time_toggle" data-t="kindToggle"></option>
          <option value="track_time_stop" data-t="kindStop"></option>
          <option value="page" data-t="kindPage"></option>
          <option value="empty" data-t="kindEmpty"></option>
        </select>
      </label>

      <div id="pagefields" hidden>
        <label class="field"><span data-t="target"></span>
          <select id="f_pagetarget">
            <option value="next" data-t="nextPage"></option>
            <option value="prev" data-t="prevPage"></option>
          </select>
        </label>
      </div>

      <div id="entityfields">
        <label class="field"><span data-t="entity"></span>
          <input type="search" id="f_entity" list="entitylist" data-t-placeholder="entityPlaceholder" autocomplete="off">
          <datalist id="entitylist"></datalist>
        </label>
        <div class="hint" id="entityinfo"></div>

        <label class="field"><span data-t="tapAction"></span>
          <input type="text" id="f_action" list="actionlist" data-t-placeholder="tapActionPlaceholder">
          <datalist id="actionlist">
            <option value="light.toggle"><option value="switch.toggle"><option value="fan.toggle">
            <option value="scene.turn_on"><option value="script.turn_on"><option value="cover.toggle">
            <option value="lock.lock"><option value="lock.unlock"><option value="input_boolean.toggle">
            <option value="button.press"><option value="media_player.media_play_pause">
          </datalist>
        </label>

        <div id="fanfields" class="box" hidden>
          <b style="font-size:12px" data-t="fanPreset"></b>
          <div class="row" style="margin-top:8px">
            <label class="field" style="margin:0"><span data-t="speed"></span><span id="f_fanspeed_wrap"></span></label>
            <label class="field" style="margin:0"><span data-t="oscillate"></span>
              <select id="f_fanosc"><option value="" data-t="unchanged"></option><option value="1" data-t="on"></option><option value="0" data-t="off"></option></select></label>
          </div>
          <div class="chk" style="margin:8px 0 0"><input type="checkbox" id="f_fanseq"><label for="f_fanseq" data-t="sequential"></label></div>
        </div>

        <label class="field"><span data-t="appearance"></span></label>
        <div class="seg" id="f_layout">
          <button data-v="full" type="button" data-t="layoutFull"></button>
          <button data-v="standard" type="button" data-t="layoutStandard"></button>
          <button data-v="gauge" type="button" data-t="layoutGauge"></button>
          <button data-v="meter" type="button" data-t="layoutMeter"></button>
        </div>
        <div style="height:12px"></div>
        <div id="gaugefields" hidden style="margin-bottom:12px">
          <div class="row">
            <label class="field" style="margin:0"><span data-t="min"></span><input type="text" id="f_gmin" placeholder="0"></label>
            <label class="field" style="margin:0"><span data-t="max"></span><input type="text" id="f_gmax" placeholder="40"></label>
            <label class="field" style="margin:0"><span data-t="valueFont"></span><input type="number" id="f_gfont" min="12" max="48" placeholder="34"></label>
          </div>
          <div class="hint" style="margin-top:6px" data-t="gaugeHint"></div>
        </div>
        <div class="chk"><input type="checkbox" id="f_indicator"><label for="f_indicator" data-t="indicator"></label></div>
      </div>

      <div id="stylefields">
        <label class="field"><span data-t="titleField"></span><input type="text" id="f_title" data-t-placeholder="titlePlaceholder"></label>
        <div class="row" style="margin-bottom:12px">
          <label class="field" style="margin:0"><span data-t="titlePos"></span>
            <select id="f_titlepos"><option value="" data-t="posDefault"></option><option value="top" data-t="posTop"></option>
              <option value="middle" data-t="posMiddle"></option><option value="bottom" data-t="posBottom"></option></select></label>
          <label class="field" style="margin:0"><span data-t="titleSize"></span><input type="number" id="f_titlesize" min="12" max="40" placeholder="22"></label>
        </div>
        <div class="row" style="margin-bottom:12px">
          <label class="field" style="margin:0"><span data-t="titleColor"></span>
            <span class="cwrap"><input type="color" id="f_titlecolor" value="#ffffff" data-set="0"><button type="button" data-cauto="f_titlecolor" data-t="auto"></button></span></label>
          <label class="field" style="margin:0"><span data-t="background"></span>
            <span class="cwrap"><input type="color" id="f_bg" value="#000000" data-set="0"><button type="button" data-cauto="f_bg" data-t="auto"></button></span></label>
        </div>
        <details id="icondetails">
          <summary data-t="overrideIcon"></summary>
          <label class="field"><span data-t="iconField"></span>
            <span class="cwrap"><input type="text" id="f_icon" data-t-placeholder="iconPlaceholder">
            <button type="button" id="iconpickbtn" data-t="gallery" data-t-title="galleryTitle"></button>
            <img class="iconprev" id="f_iconprev" src="api/icon?name=help-circle" alt="" hidden></span></label>
          <label class="field"><span data-t="colorOff"></span>
            <span class="cwrap"><input type="color" id="f_color" value="#aaaaaa" data-set="0"><button type="button" data-cauto="f_color" data-t="auto"></button></span></label>
          <label class="field"><span data-t="colorOn"></span>
            <span class="cwrap"><input type="color" id="f_coloron" value="#ffd24d" data-set="0"><button type="button" data-cauto="f_coloron" data-t="auto"></button></span>
            <div class="hint" style="margin-top:4px" data-t="colorOnHint"></div></label>
        </details>
      </div>

      <hr>
      <button class="btn" id="applybtn" style="width:100%" data-t="apply"></button>
      <div class="note" id="note" role="status"></div>
    </div>

    <div id="screenbody" hidden>
      <label class="field"><span data-t="template"></span>
        <select id="s_template">
          <option value="" data-t="chooseTemplate"></option>
          <option value="classic" data-t="tplClassic"></option>
          <option value="midnight" data-t="tplMidnight"></option>
          <option value="seconds" data-t="tplSeconds"></option>
          <option value="forest" data-t="tplForest"></option>
          <option value="ocean" data-t="tplOcean"></option>
          <option value="clockSensor" data-t="tplClockSensor"></option>
          <option value="status" data-t="tplStatus"></option>
        </select>
      </label>
      <div class="row" style="margin-bottom:12px">
        <label class="field" style="margin:0"><span data-t="background"></span>
          <span class="cwrap"><input type="color" id="s_bg" value="#000000" data-set="1"></span></label>
        <label class="field" style="margin:0"><span data-t="background2"></span>
          <span class="cwrap"><input type="color" id="s_bg2" value="#000000" data-set="0"><button type="button" data-cauto="s_bg2" data-t="none"></button></span></label>
        <label class="field" style="margin:0"><span data-t="interval"></span><input type="text" id="s_interval" placeholder="1"></label>
      </div>
      <div class="chk"><input type="checkbox" id="s_dividers"><label for="s_dividers" data-t="dividers"></label></div>
      <hr>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <b data-t="sections"></b>
        <button class="btn ghost" id="addsection" type="button" data-t="addSection"></button>
      </div>
      <div id="sections"></div>
      <hr>
      <details style="margin-bottom:12px" open>
        <summary data-t="touchZones"></summary>
        <div class="row" style="margin-bottom:10px">
          <label class="field" style="margin:0"><span data-t="left"></span>
            <select id="s_tl_page"><option value="" data-t="actionBelow"></option><option value="prev" data-t="prevPage"></option><option value="next" data-t="nextPage"></option></select></label>
          <label class="field" style="margin:0"><span data-t="right"></span>
            <select id="s_tr_page"><option value="" data-t="actionBelow"></option><option value="prev" data-t="prevPage"></option><option value="next" data-t="nextPage"></option></select></label>
        </div>
        <label class="field"><span data-t="leftAction"></span><input type="text" id="s_tl_action" list="actionlist" placeholder="light.toggle"></label>
        <label class="field"><span data-t="leftEntity"></span><input type="search" id="s_tl_entity" list="entitylist" placeholder="entity_id"></label>
        <label class="field"><span data-t="rightAction"></span><input type="text" id="s_tr_action" list="actionlist" placeholder="scene.turn_on"></label>
        <label class="field"><span data-t="rightEntity"></span><input type="search" id="s_tr_entity" list="entitylist" placeholder="entity_id"></label>
      </details>
      <button class="btn" id="applyscreen" style="width:100%" data-t="apply"></button>
      <div class="note" id="snote" role="status"></div>
    </div>
  </aside>
</main>

<div id="iconmodal" role="dialog" aria-modal="true">
  <div class="icondlg">
    <div class="dlghead">
      <h3 data-t="iconGallery"></h3>
      <button type="button" class="close" id="iconmodalclose" data-t="close"></button>
    </div>
    <div class="iconsearchrow"><input type="search" id="iconsearch" data-t-placeholder="iconSearch" autocomplete="off"></div>
    <div class="iconchips" id="iconchips"></div>
    <div class="icongrid" id="icongrid"></div>
    <div class="iconempty" id="iconempty" data-t="noIcons" hidden></div>
  </div>
</div>

<script src="static/i18n.js"></script>
<script>
"use strict";
/* ---------- texts ---------- */
const LANG = (() => {
  const all = window.HIT_THE_DECK_I18N;
  for (const tag of navigator.languages || [navigator.language || "en"]) {
    const code = String(tag).toLowerCase().split("-")[0];
    if (all[code]) return code;
  }
  return "en";
})();
function t(key, ...args){
  const text = (window.HIT_THE_DECK_I18N[LANG] || {})[key] ?? window.HIT_THE_DECK_I18N.en[key] ?? key;
  return text.replace(/\{(\d)\}/g, (_, i) => args[i] ?? "");
}
function applyTexts(root = document){
  document.documentElement.lang = LANG;
  root.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  root.querySelectorAll("[data-t-placeholder]").forEach(el => el.placeholder = t(el.dataset.tPlaceholder));
  root.querySelectorAll("[data-t-title]").forEach(el => el.title = t(el.dataset.tTitle));
  root.querySelectorAll("[data-t-alt]").forEach(el => el.alt = t(el.dataset.tAlt));
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- state ---------- */
const KIND_ALIASES = {timetracker_start: "track_time_toggle", timetracker_stop: "track_time_stop"};
let device = {type: "Stream Deck Neo", keys: 8, rows: 2, cols: 4, screen: [248, 58], connected: false};
let KEYCOUNT = 8;
let cfg = {pages: [{name: "1", buttons: []}], screen: {}, brightness: 80};
let states = [];
let sel = -1, curPage = 0, saveTimer = null;
const $ = s => document.querySelector(s);
const bust = () => "&t=" + Date.now();
const api = (path, opts) => fetch("api/" + path, opts);
const post = (path, body) => api(path, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
const flash = (id, text) => { $(id).textContent = text; setTimeout(() => { if ($(id).textContent === text) $(id).textContent = ""; }, 2500); };

function ensurePages(){
  if (!Array.isArray(cfg.pages) || !cfg.pages.length) cfg.pages = [{name: "1", buttons: cfg.buttons || []}];
  delete cfg.buttons;
  for (const p of cfg.pages){
    if (!Array.isArray(p.buttons)) p.buttons = [];
    for (const b of p.buttons) if (KIND_ALIASES[b.kind]) b.kind = KIND_ALIASES[b.kind];
    while (p.buttons.length < KEYCOUNT) p.buttons.push({kind: "empty"});
  }
  if (curPage >= cfg.pages.length) curPage = 0;
}
const pageButtons = () => cfg.pages[curPage].buttons;
const pageName = (p, i) => p.name || t("page", i + 1);

async function loadAll(){
  try { device = await (await api("device")).json(); } catch (e) {}
  KEYCOUNT = device.keys || 8;
  $("#devicenote").hidden = !!device.connected;
  $("#grid").style.gridTemplateColumns = `repeat(${device.cols || 4},1fr)`;
  $("#screenbar").hidden = !device.screen;
  cfg = await (await api("layout")).json();
  ensurePages();
  try { states = await (await api("states")).json(); } catch (e) { states = []; }
  $("#entitylist").innerHTML = states.map(s => `<option value="${esc(s.entity_id)}">${esc(s.name)}</option>`).join("");
  $("#bright").value = cfg.brightness || 80;
  $("#brightval").textContent = cfg.brightness || 80;
  buildTabs(); buildGrid(); refreshScreen(); refreshTrackTime(); loadProfiles();
}

/* ---------- pages ---------- */
function buildTabs(){
  const host = $("#pagetabs"); host.innerHTML = "";
  cfg.pages.forEach((p, i) => {
    const tab = document.createElement("div");
    tab.className = "tab" + (i === curPage ? " on" : "");
    tab.innerHTML = `<span>${esc(pageName(p, i))}</span>` + (i === curPage
      ? `<span class="x" data-a="ren" title="${esc(t("rename"))}">✎</span>` + (cfg.pages.length > 1 ? `<span class="x" data-a="del" title="${esc(t("remove"))}">✕</span>` : "")
      : "");
    tab.onclick = ev => {
      const a = ev.target.dataset.a;
      if (a === "ren"){ const n = prompt(t("pageName"), p.name || ""); if (n){ p.name = n; saveConfig(true); buildTabs(); } return; }
      if (a === "del"){ if (confirm(t("removePage", pageName(p, i)))){ cfg.pages.splice(i, 1); curPage = 0; sel = -1; saveConfig(true); buildTabs(); buildGrid(); } return; }
      curPage = i; sel = -1; $("#edbody").hidden = true; $("#edtitle").textContent = t("pickKey");
      buildTabs(); buildGrid();
    };
    host.appendChild(tab);
  });
  const add = document.createElement("div");
  add.className = "tab"; add.textContent = t("addPage");
  add.onclick = () => {
    cfg.pages.push({name: String(cfg.pages.length + 1), buttons: Array.from({length: KEYCOUNT}, () => ({kind: "empty"}))});
    curPage = cfg.pages.length - 1; saveConfig(true); buildTabs(); buildGrid();
  };
  host.appendChild(add);
}

function updateFanVis(){
  const isFan = $("#f_kind").value === "entity" && $("#f_entity").value.trim().startsWith("fan.");
  $("#fanfields").hidden = !isFan;
  const cur = $("#f_fanspeed") ? $("#f_fanspeed").value : "";
  const ent = states.find(x => x.entity_id === $("#f_entity").value.trim());
  const step = ent && ent.percentage_step;
  if (step && step > 1.5){
    let opts = `<option value="">${esc(t("unchanged"))}</option>`;
    for (let k = 1; k <= Math.round(100 / step); k++){
      const pct = Math.min(100, Math.round(k * step));
      opts += `<option value="${pct}">${esc(t("step", k, pct))}</option>`;
    }
    $("#f_fanspeed_wrap").innerHTML = `<select id="f_fanspeed">${opts}</select>`;
    if (cur){ const k = Math.max(1, Math.round(parseFloat(cur) / step)); $("#f_fanspeed").value = String(Math.min(100, Math.round(k * step))); }
  } else {
    $("#f_fanspeed_wrap").innerHTML = `<input type="number" id="f_fanspeed" min="1" max="100" placeholder="${esc(t("speedPlaceholder"))}">`;
    if (cur) $("#f_fanspeed").value = cur;
  }
}

function collectButton(){
  const k = $("#f_kind").value;
  if (k === "empty") return {kind: "empty"};
  const style = {};
  const title = $("#f_title").value; if (title) style.title = title;
  const tp = $("#f_titlepos").value; if (tp) style.title_pos = tp;
  const ts = parseInt($("#f_titlesize").value, 10); if (!isNaN(ts)) style.title_size = ts;
  const tc = getColor("f_titlecolor"); if (tc) style.title_color = tc;
  const bg = getColor("f_bg"); if (bg) style.bg = bg;
  if (k === "page"){
    const b = Object.assign({kind: "page", page_target: $("#f_pagetarget").value}, style);
    const ic = $("#f_icon").value.trim(); if (ic) b.icon = ic;
    const col = getColor("f_color"); if (col) b.color = col;
    return b;
  }
  if (k !== "entity") return Object.assign({kind: k}, style);
  const b = Object.assign({kind: "entity", entity_id: $("#f_entity").value.trim(), layout: getLayout(),
                           service_indicator: $("#f_indicator").checked}, style);
  const old = pageButtons()[sel] || {};
  if (old.action_data || old.service_data) b.action_data = old.action_data || old.service_data;
  if (old.sequence) b.sequence = old.sequence;
  const action = $("#f_action").value.trim(); if (action) b.tap_action = action;
  const ic = $("#f_icon").value.trim(); if (ic) b.icon = ic;
  const col = getColor("f_color"); if (col) b.color = col;
  const con = getColor("f_coloron"); if (con) b.color_on = con;
  if (b.layout === "gauge" || b.layout === "meter"){
    const mn = parseFloat($("#f_gmin").value), mx = parseFloat($("#f_gmax").value), gf = parseInt($("#f_gfont").value, 10);
    if (!isNaN(mn)) b.gauge_min = mn;
    if (!isNaN(mx)) b.gauge_max = mx;
    if (!isNaN(gf)) b.gauge_font = gf;
  }
  if (b.entity_id.startsWith("fan.")){
    const sp = parseInt($("#f_fanspeed").value, 10); if (!isNaN(sp)) b.fan_speed = sp;
    const os = $("#f_fanosc").value; if (os !== "") b.fan_oscillate = os === "1";

}

/* ---------- info bar editor ---------- */
let scrSections = [];
const SEC_TYPES = {clock: "secClock", date: "secDate", entity: "secEntity", text: "secText"};
const SIZES = {s: "S", m: "M", l: "L", xl: "XL"};
const DEFAULT_SECTIONS = [{type: "clock", format: "%H:%M", size: "xl", weight: 3},
                          {type: "date", weekday: true, weekday_style: "long", size: "l", weight: 2}];

function selectScreen(){
  sel = -1; buildGrid();

  $("#screenimg").style.outline = "3px solid var(--accent)";

  $("#s_dividers").checked = !!s.dividers;
  scrSections = JSON.parse(JSON.stringify(s.sections || DEFAULT_SECTIONS));
  const tl = cfg.touch_left || {}, tr = cfg.touch_right || {};
  $("#s_tl_page").value = tl.page || ""; $("#s_tr_page").value = tr.page || "";
  $("#s_tl_action").value = tl.tap_action || tl.tap_service || ""; $("#s_tl_entity").value = tl.entity_id || "";
  $("#s_tr_action").value = tr.tap_action || tr.tap_service || ""; $("#s_tr_entity").value = tr.entity_id || "";
  renderSections();
}
const secField = (label, html) => `<label class="field" style="margin:0 0 8px"><span>${esc(t(label))}</span>${html}</label>`;
const secColor = (label, field, val, fallback) => `<label class="field" style="margin:0 0 8px"><span>${esc(t(label))}</span>
  <span class="cwrap"><input type="color" data-f="${field}" value="${esc(val || fallback)}">
  <button type="button" data-cclear="${field}" class="${val ? "" : "autoactive"}">${esc(t("auto"))}</button></span></label>`;
const opt = (value, label, on) => `<option value="${esc(value)}" ${on ? "selected" : ""}>${esc(label)}</option>`;

function renderSections(){
  const host = $("#sections"); host.innerHTML = "";
  scrSections.forEach((sec, i) => {
    const card = document.createElement("div");
    card.className = "box";
    let html = `<div style="display:flex;gap:6px;align-items:center;margin-bottom:8px">
      <select data-f="type" style="flex:2">${Object.entries(SEC_TYPES).map(([v, l]) => opt(v, t(l), sec.type === v)).join("")}</select>
      <select data-f="weight" title="${esc(t("width"))}" style="flex:1">${[1, 2, 3, 4].map(w => opt(w, w + "×", (sec.weight || 1) == w)).join("")}</select>
      <select data-f="size" title="${esc(t("size"))}" style="flex:1">${Object.entries(SIZES).map(([v, l]) => opt(v, l, (sec.size || "m") === v)).join("")}</select>
      <button type="button" data-a="up" class="btn ghost small" aria-label="◀">◀</button>
      <button type="button" data-a="down" class="btn ghost small" aria-label="▶">▶</button>
      <button type="button" data-a="del" class="btn ghost small" title="${esc(t("remove"))}">✕</button></div>`;
    if (sec.type === "clock"){
      html += secField("timeFormat", `<input type="text" data-f="format" value="${esc(sec.format || "%H:%M")}" placeholder="%H:%M · %H:%M:%S">`);
      html += secColor("color", "color", sec.color, "#FFFFFF");
    } else if (sec.type === "date"){
      html += `<div class="chk" style="margin-bottom:8px"><input type="checkbox" data-f="weekday" id="wd${i}" ${sec.weekday !== false ? "checked" : ""}><label for="wd${i}">${esc(t("showWeekday"))}</label></div>`;
      html += secField("weekdayStyle", `<select data-f="weekday_style">${opt("long", t("long"), sec.weekday_style !== "short")}${opt("short", t("short"), sec.weekday_style === "short")}</select>`);
      html += secField("dateFormat", `<input type="text" data-f="format" value="${esc(sec.format || "")}" placeholder="${esc(t("dateFormatHint"))}">`);
      html += `<div class="row">` + secColor("dateColor", "color", sec.color, "#FFFFFF") + secColor("weekdayColor", "weekday_color", sec.weekday_color, "#9aa0a8") + `</div>`;
    } else if (sec.type === "text"){
      html += secField("text", `<input type="text" data-f="text" value="${esc(sec.text || "")}">`);
      html += secColor("color", "color", sec.color, "#FFFFFF");
    } else {
      html += secField("entity", `<input type="search" data-f="entity_id" list="entitylist" value="${esc(sec.entity_id || "")}">`);
      html += secField("label", `<input type="text" data-f="label" value="${esc(sec.label || "")}">`);
      html += secField("format", `<input type="text" data-f="format" value="${esc(sec.format || "{state}{unit}")}" placeholder="{state}{unit}">`);
      html += `<div class="row">` + secColor("colorOnState", "color_on", sec.color_on, "#ffd484") + secColor("colorOffState", "color_off", sec.color_off, "#FFFFFF") + `</div>`;
    }
    card.innerHTML = html;
    card.querySelectorAll("[data-f]").forEach(el => {
      el.onchange = () => {
        const f = el.dataset.f;
        if (el.type === "checkbox") sec[f] = el.checked;
        else if (f === "weight") sec[f] = parseInt(el.value, 10);
        else if (el.type === "color"){ sec[f] = el.value; const b = card.querySelector(`[data-cclear="${f}"]`); if (b) b.classList.remove("autoactive"); }
        else if (el.value === "") delete sec[f];
        else sec[f] = el.value;
        if (f === "type") renderSections();
      };
    });
    card.querySelectorAll("[data-cclear]").forEach(btn => btn.onclick = () => { delete sec[btn.dataset.cclear]; renderSections(); });
    card.querySelectorAll("[data-a]").forEach(btn => btn.onclick = () => {
      const a = btn.dataset.a;
      if (a === "del") scrSections.splice(i, 1);
      if (a === "up" && i > 0) [scrSections[i - 1], scrSections[i]] = [scrSections[i], scrSections[i - 1]];
      if (a === "down" && i < scrSections.length - 1) [scrSections[i + 1], scrSections[i]] = [scrSections[i], scrSections[i + 1]];
      renderSections();
    });
    host.appendChild(card);
  });
}
