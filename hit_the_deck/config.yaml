name: "Hit the Deck"
version: "1.0.0"
slug: hit_the_deck
description: "Control Home Assistant from a Stream Deck plugged into your Home Assistant machine, with a configurator in the sidebar. Works best with Track Time."
url: "https://github.com/simon-says-labs/hit-the-deck"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:gesture-tap-button
panel_title: "Hit the Deck"
homeassistant_api: true
# Default role: only lets the app read the info of other apps, used to find Track Time.
hassio_api: true
# The Stream Deck is a USB HID device. These rights were needed to open it on Home Assistant OS
# (without them: "Could not open HID device"); see SECURITY.md.
full_access: true
udev: true
privileged:
  - SYS_RAWIO
map:
  - type: app_config
    read_only: false
backup: hot
# Optional options (brightness_light_entity, track_time_url, track_time_api_key) stay out of the
# defaults: the Supervisor checks every option that is present, also an empty one.
options:
  language: auto
  auto_brightness: false
  brightness_min: 10
schema:
  language: "list(auto|en|de|fr|it|es)"
  auto_brightness: bool
  brightness_light_entity: "match(^[a-z_]+\\.[a-z0-9_]+$)?"
  brightness_min: "int(0,100)"
  track_time_url: "url?"
  track_time_api_key: "password?"
